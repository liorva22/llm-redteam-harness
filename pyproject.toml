[project]
name = "llm-redteam-harness"
version = "1.0.0"
description = "Guardrails for a toy LLM assistant plus a versioned red-team suite, nightly replay and dashboard."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redteam"]

[tool.setuptools.package-data]
redteam = ["static/*.html"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
