name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: redteam
          POSTGRES_PASSWORD: redteam
          POSTGRES_DB: redteam
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U redteam" --health-interval 2s --health-retries 30
    env:
      MOCK_MODE: "1"
      DATABASE_URL: postgresql://redteam:redteam@localhost:5432/redteam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
